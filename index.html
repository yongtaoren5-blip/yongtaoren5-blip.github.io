<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的3D产品展示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }
	 
    #3d-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* 模型切换按钮 */
    .feature-container {
      position: absolute;
      bottom: 8%;
      left: 0%;
      width: 100%;
      padding: 0 10%;
      z-index: 10;
    }
    .feature-list {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .feature-btn {
      flex: 1;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      font-size: 0;
      backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      -webkit-backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1),
        0 4px 12px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .feature-btn[data-feature="model1"]::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 4px;
      background: rgba(255, 20, 10, 0.8);
      border-radius: 3px;
      mix-blend-mode: overlay;
    }
    .feature-btn[data-feature="model2"]::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 4px;
      background: rgba(50, 100, 10, 0.8);
      border-radius: 3px;
      mix-blend-mode: overlay;
    }
    .feature-btn[data-feature="model3"]::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      height: 4px;
      background: rgba(25, 25, 25, 0.8);
      border-radius: 3px;
      mix-blend-mode: overlay;
    }
    .feature-btn.active {
      backdrop-filter: blur(20px) saturate(200%) contrast(110%);
      -webkit-backdrop-filter: blur(20px) saturate(200%) contrast(110%);
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 6px 16px rgba(0, 0, 0, 0.12);
      transform: translateY(-1px);
    }
    @media (max-width: 428px) {
      .feature-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }
    }
    /* 正方体指引按钮 */
    .direction-guide {
      position: absolute;
      top: 5%;
      left: 5%;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      perspective: 150px;
      transform-style: preserve-3d;
    }
    .cube-btn {
      width: 60px;
      height: 60px;
	  cursor: pointer;
	    z-index: 999;
	    pointer-events: auto !important;
	    touch-action: none;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      backface-visibility: hidden;
    }
    @media (max-width: 428px) {
      .cube-btn {
        width: 40px;
        height: 40px;
      }
      .direction-guide {
        perspective: 100px;
      }
    }
    .cube-face {
	  pointer-events: none;
      position: absolute;
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      -webkit-backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      background: rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #fff;
      font-weight: 600;
      backface-visibility: hidden;
    }
    .cube-front  { transform: translateZ(30px); }
    .cube-back   { transform: rotateY(180deg) translateZ(30px); }
    .cube-top    { transform: rotateX(90deg) translateZ(30px); }
    .cube-bottom { transform: rotateX(-90deg) translateZ(30px); }
    .cube-left   { transform: rotateY(-90deg) translateZ(30px); }
    .cube-right  { transform: rotateY(90deg) translateZ(30px); }
    @media (max-width: 428px) {
      .cube-front  { transform: translateZ(20px); }
      .cube-back   { transform: rotateY(180deg) translateZ(20px); }
      .cube-top    { transform: rotateX(90deg) translateZ(20px); }
      .cube-bottom { transform: rotateX(-90deg) translateZ(20px); }
      .cube-left   { transform: rotateY(-90deg) translateZ(20px); }
      .cube-right  { transform: rotateY(90deg) translateZ(20px); }
    }
    .direction-text {
      color: #fff;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(0, 0, 0, 0.01);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* LOGO样式 */
    .logo-container {
      position: absolute;
      top: -60px;
      right: 20px;
      z-index: 10;
    }
    .logo-link {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-decoration: none;
    }
    .logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      position: relative;
    }
    .logo-desc {
      color: #fff;
      font-size: 14px;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      background: rgba(0, 0, 0, 0.01);
      padding: 4px 5px;
      border-radius: 0px;
      position: relative;
      left: 0;
	  top: 80px;
      transform: translateY(0);
      width: auto;
      text-align: right;
    }
    .logo-img {
      width: 300px;
      height: auto;
      display: block;
      margin: 0;
    }
	/* Home返回按钮样式 */
    .home-btn-container {
      position: absolute;
      bottom: 3%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .home-btn {
      width: 300px;
      height: 20px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      touch-action: manipulation;
      backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      -webkit-backdrop-filter: blur(20px) saturate(180%) contrast(105%);
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.25),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1),
        0 4px 12px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .home-btn:hover {
      backdrop-filter: blur(20px) saturate(200%) contrast(110%);
      -webkit-backdrop-filter: blur(20px) saturate(200%) contrast(110%);
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15),
        0 6px 16px rgba(0, 0, 0, 0.12);
      transform: translateY(-1px);
    }
    /* 移动端适配 Home 按钮 */
    @media (max-width: 428px) {
      .home-btn {
        width: 160px;
        height: 20px;
        font-size: 14px;
        border-radius: 12px;
      }
      .home-btn-container {
        bottom: 2%;
        left: 50%;
        transform: translateX(-50%);
      }
    }
   /* ========= ICU按钮样式 ========= */
       .icu-wrap{
         position:absolute;
         top:14%;
         left:5%;
         z-index:11;
       }
       .icu-main-btn{
         padding:8px 14px;
         border:none;
         border-radius:10px;
         background:rgba(255,255,255,0.14);
         backdrop-filter: blur(16px);
         color:#fff;
         font-size:14px;
         cursor:pointer;
       }
       .icu-submenu{
         display:none;  /* 默认隐藏！！之前bug在这里 */
         margin-top:8px;
         flex-direction:column;
         gap:6px;
       }
       /* js添加show类的时候才显示 */
       .icu-submenu.show{
         display:flex;
       }
       .icu-sub-btn{
         width:110px;
         height:32px;
         border:none;
         border-radius:8px;
         background:rgba(255,255,255,0.12);
         backdrop-filter: blur(14px);
         color:#fff;
         cursor:pointer;
         font-size:12px;
       }
       .icu-sub-btn:hover{
         background:rgba(255,255,255,0.22);
       }
    
    /* 移动端适配 */
    @media (max-width: 428px) {
      .logo-wrap {
        gap: 2px;
      }
      .logo-desc {
        font-size: 12px;
        padding: 3px 8px;
        left: 0;
        transform: translateY(0);
        width: auto;
      }
      .logo-img {
        width: 200px;
      }
      .icu-wrap{
        top:16%;
      }
      .icu-sub-btn{
        width:90px;
        height:28px;
      }
    }
  </style>
</head>
<body>
  <div id="3d-container">
    <!-- 模型切换按钮 -->
    <div class="feature-container">
      <div class="feature-list">
        <button class="feature-btn active" data-feature="model1"></button>
        <button class="feature-btn" data-feature="model2"></button>
        <button class="feature-btn" data-feature="model3"></button>
      </div>
    </div>
    <!-- 正方体指引按钮 -->
    <div class="direction-guide">
      <div class="direction-text">Initialization</div>
      <div class="cube-btn" id="cubeGuideBtn">
        <div class="cube-face cube-front">前</div>
        <div class="cube-face cube-back">后</div>
        <div class="cube-face cube-top">上</div>
        <div class="cube-face cube-bottom">下</div>
        <div class="cube-face cube-left">左</div>
        <div class="cube-face cube-right">右</div>
      </div>
    </div>
    <!-- ICU悬浮按钮 -->
    <div class="icu-wrap">
      <button class="icu-main-btn">ICU</button>
      <div class="icu-submenu" data-icu-base-x="0" data-icu-base-y="-1.5" data-icu-base-z="0.6">
        <button class="icu-sub-btn" data-icu="icu1" data-stack-allow="icu1,icu2,icu3,icu4">shallow small</button>
        <button class="icu-sub-btn" data-icu="icu2" data-stack-allow="icu1,icu2,icu3,icu4">pro small</button>
        <button class="icu-sub-btn" data-icu="icu3" data-stack-allow="icu1,icu2,">shallow medium</button>
        <button class="icu-sub-btn" data-icu="icu4" data-stack-allow="icu1,icu2">slope medium</button>
        <button class="icu-sub-btn" data-icu="icu5" data-stack-allow="">pro large</button>
		<button class="icu-sub-btn" data-icu="icu6" data-stack-allow="">pro xl</button>
      </div>
    </div>
    <!-- LOGO区域 -->
    <div class="logo-container">
      <a href="https://fstopgear.com/product/ajna-37l-duradiamond/" target="_blank" class="logo-link">
        <div class="logo-wrap">
          <span class="logo-desc">shop</span>
          <img src="static/fstop_logo-003-2.png" alt="品牌logo" class="logo-img">
        </div>
      </a>
    </div>
	<-- Home返回按钮 -->
    <div class="home-btn-container">
      <button class="home-btn" id="homeBtn">Home</button>
    </div>
  </div>
  <!-- 依赖脚本（移除无用的DRACOLoader） -->
  <script src="js/three.js"></script>
  <script src="js/GLTFLoader.js"></script>
  <script src="js/OrbitControls.js"></script>
  <script src="js/gsap.min.js"></script>
  <!-- Home按钮跳转逻辑 -->
  <script>
    const homeBtn = document.getElementById('homeBtn');
    homeBtn.addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
  <!-- 页面配置（对齐home.js的配置风格） -->
  <script>
    window.PAGE_CONFIG = {
      // 初始加载模型
      modelPath: 'static/m136red.glb',
      // 模型基础配置
      ambientIntensity: 2,
      dirIntensity: 1.2,
      modelScale: 6, // 简化为单值（和home.js一致）
      modelYPos: 0,
      cameraPos: [0, 0, 6],
      autoRotateSpeed: 0.001,
      // 模型切换配置
      featureModels: {
        model1: 'static/m136red.glb',
        model2: 'static/m136green.glb',
        model3: 'static/m136black.glb'
      },
      // ========= ICU模型配置，每个页面可以在这里修改大小、位置、路径 =========
      icu:{
        scale:6,
        offsetX:0.1,
        offsetY:0.5,
        offsetZ:0.25,
        featureModels:{
          icu1:"static/shallow small-1.glb",
          icu2:"static/pro small-1.glb",
          icu3:"static/shallow m-1.glb",
          icu4:"static/slope m-1.glb",
          icu5:"static/pro l-1.glb",
		  icu6:"static/pro xl-1.glb"
        }
      }
    };
	</script>
	<script>
	// ICU菜单展开/收起逻辑
	const icuMainBtn = document.querySelector('.icu-main-btn');
	const icuSubMenu = document.querySelector('.icu-submenu');

	// 仅点击ICU大按钮：展开 / 再次点击收回；不监听悬浮、不监听页面空白
	icuMainBtn.addEventListener('click', function(e){
	  e.stopPropagation();
	  const willShow = !icuSubMenu.classList.contains('show');
	  icuSubMenu.classList.toggle('show');
	  // 收起时：清除已加载的ICU模型，并把主模型透明度恢复到100%
	  if(!willShow && typeof window.clearIcuModel === 'function'){
	    window.clearIcuModel();
	  }
	});
	</script>
  <script src="js/app.js"></script>
</body>
</html>
